<!-- 
  @file index.html
  @description Archivo HTML principal del frontend. Es el punto de entrada de la aplicación.
  Vite inyecta automáticamente los scripts y estilos compilados en este archivo.
  Aquí se cargan las dependencias externas de CSS y JS (Bootstrap, Font Awesome, etc.)
-->
<!doctype html>
<!-- Elemento raíz HTML con idioma español y tema claro de Bootstrap -->
<html lang="es" data-bs-theme="light">
  <head>
    <!-- Codificación de caracteres UTF-8 para soportar tildes y caracteres especiales -->
    <meta charset="UTF-8" />
    <!-- Ícono de la pestaña del navegador (favicon) con el logo oficial de Ecosystem -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Meta viewport para diseño responsivo en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título de la página que aparece en la pestaña del navegador -->
    <title>Ecosystem Sena - Laboratorio Ambiental</title>

    <!-- Metaetiquetas SEO para indexación en Google y buscadores -->
    <meta name="description" content="Ecosystem Sena - Sistema de información integral para la gestión, inventario de reactivos, control de equipos y trazabilidad del Laboratorio Ambiental SENA Centro Agropecuario La Granja." />
    <meta name="keywords" content="Ecosystem, Ecosystem Sena, Laboratorio Ambiental SENA, SENA La Granja, ecosystemlabam, gestion de laboratorio, reactivos, equipos de laboratorio, ADSO" />
    <meta name="author" content="Ecosystem ADSO SENA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ecosystemlabam.com/" />

    <!-- Open Graph para redes sociales y vistas previas en Google -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ecosystem Sena - Laboratorio Ambiental" />
    <meta property="og:description" content="Sistema de gestión integral para reactivos, equipos y préstamos del Laboratorio Ambiental SENA." />
    <meta property="og:url" content="https://ecosystemlabam.com/" />
    <meta property="og:image" content="https://ecosystemlabam.com/favicon.png" />
    <meta property="og:site_name" content="Ecosystem Sena" />

    <!-- Verificación de Google Search Console para aparecer e indexar en Google -->
    <meta name="google-site-verification" content="5aVMUY59jBmKBMJFxEEdfTGmaxKfRjZx_X87AxbsG3E" />

    <!-- Datos estructurados Schema.org para Google Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ecosystem Sena",
      "alternateName": "Ecosystem Laboratorio Ambiental SENA",
      "url": "https://ecosystemlabam.com/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "description": "Sistema de Gestión y Trazabilidad para el Laboratorio Ambiental SENA Centro Agropecuario La Granja."
    }
    </script>

    <!-- ===== DEPENDENCIAS CSS EXTERNAS ===== -->

    <!-- Íconos de Bootstrap v1.11.1 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Font Awesome v7.0.1 - Biblioteca de íconos vectoriales adicionales -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Contenedor raíz donde React renderiza toda la aplicación -->
    <div id="root"></div>
    <!-- Script principal de la aplicación React (Vite lo procesa como módulo ES) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
